# model configuration
defaults:
  - model_cfg: gemnet_cfg # direcotry in conf: file name
  - _self_

# dataset info
oc20_train: "/workspace/datasets/full/is2res_train_val_test_lmdbs/data/is2re/all/train/data.lmdb"
oc20_val:   "/workspace/datasets/full/is2res_train_val_test_lmdbs/data/is2re/all/val_id/data.lmdb"
batch_size: 4
num_workers: 4

# training hyperparameters 
lr: 1e-3
max_epochs: 3000
accumulate_grad_batches: 4

# computer arch
accelerator: "cpu"
devices: 16
num_nodes: 1
strategy: "auto"
precision: "16-mixed"

# checkpointing/logging
logger: false
project: "adsflow"
run_name: "gauntlet-full"
ckpt_dir: "checkpoints"
ckpt_monitor: "val/loss"
ckpt_mode: "min"
ckpt_save_top_k: 3
ckpt_save_last: true
ckpt_path: null

# misc
seed: 42
from_noise: false
