# model configuration
defaults:
  - model_cfg: EquiV2-flow_cfg # direcotry in conf: file name
  - _self_

# Model mode
mode: "train"
regressor: "EquiformerV2"

# dataset infota_refin
oc20_train: "/workspace/datasets/full/is2res_train_val_test_lmdbs/data/is2re/all/train/data_refined.lmdb"
oc20_val:   "/workspace/datasets/full/is2res_train_val_test_lmdbs/data/is2re/all/val_id/data_refined.lmdb"
oc20_mini:  "/workspace/datasets/mini/data.lmdb"
oc20_test:  "/workspace/datasets/mini/data_refined.lmdb"

# training hyperparameters/settings
batch_size: 8
num_workers: 8
lr: 0.0002
weight_decay: 0.001
accumulate_grad_batches: 4

# checkpointing/logging
logger: false
project: "adsflow"
run_name: "equiformer-model"
track_grad_norms: true

# restart run 
ckpt_path: "checkpoints/equiformer-model-epoch=22.ckpt"
run_id: null # log id from wandb

# computer arch
accelerator: "gpu"
devices: 8
num_nodes: 1
precision: "bf16-mixed"