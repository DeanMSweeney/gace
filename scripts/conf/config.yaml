# model configuration
defaults:
  - model_cfg: gemnet-flow_cfg # direcotry in conf: file name
  - _self_

# Model mode
mode: "eval"

# dataset info
oc20_train: "/workspace/datasets/full/is2res_train_val_test_lmdbs/data/is2re/all/train/data.lmdb"
oc20_val:   "/workspace/datasets/full/is2res_train_val_test_lmdbs/data/is2re/all/val_id/data.lmdb"
oc20_mini:  "/workspace/datasets/mini/data.lmdb"
oc20_test:  "/workspace/datasets/mini/data.lmdb"
#"/workspace/datasets/full/is2res_train_val_test_lmdbs/data/is2re/all/val_ood_both/data.lmdb"

# training hyperparameters/settings
batch_size: 32
num_workers: 8
lr: 1e-3
max_epochs: 3000
accumulate_grad_batches: 1
val_check_interval: 1000

# checkpointing/logging
logger: false
project: "adsflow"
run_name: "gauntlet-sonic"
ckpt_dir: "checkpoints"
ckpt_path: "checkpoints/gauntlet_trained.ckpt" 

# sampler setings
rtol: 1e-7
atol: 1e-9
ode_method: "euler"

# computer arch
accelerator: "gpu"
devices: 1
num_nodes: 1
strategy: "ddp_find_unused_parameters_false"
precision: "16-mixed"

# misc
from_noise: false
