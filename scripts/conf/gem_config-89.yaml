# model configuration
defaults:
  - model_cfg: gemnet-89 # direcotry in conf: file name
  - _self_

# Model mode
mode: "eval"
regressor: "GemNet-OC"

# datasets
oc20_train: "/workspace/datasets/full/is2res_train_val_test_lmdbs/data/is2re/all/train/data_refined.lmdb"
oc20_val:   "/workspace/datasets/full/is2res_train_val_test_lmdbs/data/is2re/all/val_id/data_refined.lmdb"
oc20_mini:  "/workspace/datasets/mini/data_refined.lmdb"
oc20_test:  "/workspace/datasets/mini/data_refined.lmdb"

# training hyperparameters/settings
batch_size: 1
num_workers: 8
max_epochs: 400
accumulate_grad_batches: 2

optimizer_hparams:
  weight_decay: 0.01
  lr: 0.0002
  lr_scheduler: "cosine_w_warmup"
  num_cycles: 0.50
  warmup_proportion: 0.01

# checkpointing/logging
logger: false
project: "adsflow"
run_name: "gemnet-oc:cyclic"

# restart run 
ckpt_path: "checkpoints/gemnet-oc-epoch=190.ckpt"
run_id: null  # log id from wandb

# computer arch
accelerator: "gpu"
devices: 1
num_nodes: 1
precision: 32

ode_method: "euler"