# model configuration
defaults:
  - model_cfg: gemnet-32 # direcotry in conf: file name
  - _self_

# Model mode
mode: "train"
regressor: "GemNet-OC"

# datasets
oc20_train: "/workspace/datasets/full/is2res_train_val_test_lmdbs/data/is2re/all/train/data_refined.lmdb"
oc20_val:   "/workspace/datasets/full/is2res_train_val_test_lmdbs/data/is2re/all/val_id/data_refined.lmdb"
oc20_mini:  "/workspace/datasets/mini/data.lmdb"
oc20_test:  "/workspace/datasets/mini/data_refined.lmdb"

# training hyperparameters/settings
batch_size: 32
num_workers: 8
max_epochs: 200
accumulate_grad_batches: 1

optimizer_hparams:
  weight_decay: 0.01
  lr: 0.001
  lr_scheduler: "cosine_w_warmup"
  num_cycles: 0.50
  warmup_proportion: 0.01

# checkpointing/logging
logger: false
project: "adsflow"
run_name: "gemnet-oc"

# restart run 
ckpt_path: null
run_id: null  # log id from wandb

# computer arch
accelerator: "gpu"
devices: 8
num_nodes: 1
precision: "bf16-mixed"
