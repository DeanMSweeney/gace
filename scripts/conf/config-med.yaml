# model configuration
defaults:
  - model_cfg: gemnet-flow-med_cfg # direcotry in conf: file name
  - _self_

# Model mode
mode: "train"

# dataset info
oc20_train: "/workspace/datasets/full/is2res_train_val_test_lmdbs/data/is2re/all/train/data.lmdb"
oc20_val:   "/workspace/datasets/full/is2res_train_val_test_lmdbs/data/is2re/all/val_id/data.lmdb"
oc20_mini:  "/workspace/datasets/mini/data.lmdb"
oc20_test:  "/workspace/datasets/full/is2res_train_val_test_lmdbs/data/is2re/all/val_ood_both/data.lmdb"

# training hyperparameters/settings
batch_size: 8
num_workers: 8
lr: 0.0001
max_epochs: 3000
accumulate_grad_batches: 4
val_check_interval: 1.0

# checkpointing/logging
logger: false
project: "adsflow"
run_name: "smart-med"
ckpt_dir: "checkpoints"
ckpt_path: "checkpoints/smart-med-epoch=05.ckpt"
run_id: "izjfk0u5"

# sampler setings
rtol: 1e-9
atol: 1e-12
ode_method: "euler"

# computer arch
accelerator: "gpu"
devices: 8
num_nodes: 1
strategy: "ddp_find_unused_parameters_false"
precision: 32

# misc
mask_atoms: true
