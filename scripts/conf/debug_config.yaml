# model configuration
defaults:
  - model_cfg: mini_gemnet-oc_cfg # direcotry in conf: file name
  - _self_

# dataset info
oc20_train: "/workspace/datasets/full/is2res_train_val_test_lmdbs/data/is2re/all/train/data.lmdb"
oc20_val:   "/workspace/datasets/full/is2res_train_val_test_lmdbs/data/is2re/all/val_id/data.lmdb"
oc20_mini: "/workspace/datasets/mini/data.lmdb"
batch_size: 8
num_workers: 0

# training hyperparameters 
lr: 1e-3
max_epochs: 3000
accumulate_grad_batches: 4

# computer arch
accelerator: "cpu"
devices: 8
num_nodes: 1
strategy: "ddp_find_unused_parameters_true"
precision: "16-mixed"

# checkpointing/logging
debug_mode: true
logger: false
project: "adsflow"
run_name: "debug_run"
ckpt_dir: "checkpoints"
ckpt_path: null

# misc
seed: 42
flow_matching: true
from_noise: false

