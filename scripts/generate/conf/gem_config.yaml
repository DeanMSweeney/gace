# model configuration
defaults:
  - model_cfg: gemnet-flow_cfg # direcotry in conf: file name
  - _self_

# Model mode
mode: "eval"
regressor: "GemNet-OC"

# dataset info
oc20_test:  "/workspace/datasets/mini/data_refined.lmdb"
input_file: "input_struc.vasp"
#output_file: "gen_struc.vasp"

# restart from model ckpt
ckpt_path: "gauntlet-smart-epoch=78.ckpt"

# sampler setings
rtol: 1e-9
atol: 1e-12
ode_method: "euler"

# computer arch
accelerator: "gpu"
devices: 1
num_nodes: 1
strategy: "ddp_find_unused_parameters_false"
precision: "32"
